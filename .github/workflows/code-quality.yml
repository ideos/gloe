name: Code quality

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,docs]'
      - run: black --check gloe tests docs/source/examples/pipelines.py
      - run: flake8 gloe tests docs/source/examples/pipelines.py
      - run: mypy --config-file mypy.ini gloe
      - run: python -m build
      - run: sphinx-build -W --keep-going -b html docs/source docs/build/html
